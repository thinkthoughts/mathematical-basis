statement:
  id: MB_0001
  title: "Residue Conditioning Specifies a Primorial Density Correction"
  repository: mathematical-basis

status:
  mathematical: proved
  computational: supported
  provenance: audited
  publication: draft

source_provenance:
  - source_ref: sources/mb_0001/persist.pdf
    role: historical_hypothesis_source
    original_claim: "r(L, Pk) -> 24/25, for m=6, a=5"
    original_claim_status: superseded
    sha256: 8faa1cc0d02b6498b7e41906d80ce67dcb51bfb982aed9e41e96b3d3a17cb046
    note: >
      Preserved verbatim at the ref above. Its reported constant did not
      reproduce under its own stated verification code; the audit that
      found this lives in the residue-manifold-learning repo's
      tests/basis/, not in this repository.

specification:
  domain:
    primorial: Pk
    modulus: m
    residue: a
    constraints:
      - "m divides Pk"
      - "m > 1"
      - "gcd(a, m) = 1"
      - "Pk squarefree (product of the first k primes)"

  statement: >
    The exact correction factor between the conditioned coprimality
    count |{n <= L : n === a (mod m), gcd(n, Pk) = 1}| and the naive
    independent-density predictor (phi(Pk)/Pk)*(L/m) is
    C(m) = m / phi(m), independent of which admissible residue a is
    chosen. The exact per-period count (period Pk) is phi(Pk/m).

  specializations:
    - {m: 6, C_m: 3, phi_Pk_over_m_at_Pk_210: 24}
    - {m: 10, C_m: 2.5, phi_Pk_over_m_at_Pk_210: 12}
    - {m: 30, C_m: 3.75, phi_Pk_over_m_at_Pk_210: 6}

  leading_constraints:
    - "A shared label does not establish a shared reading."
    - "A shared reading does not, on its own, establish a shared specification."
    - "This statement is a purely arithmetic result; it does not establish physical_correspondence of any kind (see correspondence.yaml's firewall, residue-manifold-learning repo)."

  excluded_generalizations:
    - "C(m) for non-squarefree m or non-primorial Pk (the proof uses squarefreeness throughout)."
    - "The 9423 weighted-vector construction (paper.md Section 3) as part of this statement's leading specification -- it is a separate, rejected correspondence claim retained in the paper only as a worked example."

verification:
  proof_ref: papers/density-correction/paper.md
  proof_location: "Section 2, Theorem 1"
  executable_ref: tests/MB_0001_general_sweep.py
  executable_sha256: 16bd7b59dbf6c3c48de0953d3a5f20bc165bffa049bd89042fbfb0d65aaabbc1

result:
  result_ref: results/MB_0001_general_sweep.yaml
  claim_status: supported
  summary: >
    C(m) matches m/phi(m) at the largest tested L (10^7) for every (m,a)
    pair across m in {6,10,30}; exact per-period count matches
    phi(Pk/m) for every tested admissible a. One entry (m=30, a=1,
    smallest tested L) fell outside tolerance as expected finite-size
    fluctuation per Theorem 1's bounded remainder term; this does not
    gate claim_status.

footer:
  principle: "Admissible generalizations trail leading specifications."
