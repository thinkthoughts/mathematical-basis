statement:
  id: MB_0003
  title: "Fano-Line Orientations Specify a Unique Alternative Octonion Class"
  repository: mathematical-basis

status:
  mathematical: proved
  computational: supported
  provenance: audited
  publication: draft

source_provenance:
  - source_ref: "sources/mb_0003/baez-octonions.md (excerpt of John C. Baez, 'The Octonions', arXiv:math/0105155, Table 1 and Section 2.1)"
    role: canonical_reference
    original_claim: "The oriented Fano plane, with the seven cyclically-ordered lines shown, completely describes the octonion multiplication table."
    original_claim_status: independently_reverified_and_extended
    note: >
      Baez's Table 1 and Fano-plane construction were used as the ground-truth
      target to reconstruct and verify against, not imported on authority.
      This statement extends past Baez's single fixed orientation to classify
      all 128 possible orientations of the same seven lines.

specification:
  domain:
    fano_lines: "cyclic shifts of {1,2,4} mod 7 (Singer difference set): {1,2,4},{2,3,5},{3,4,6},{4,5,7},{5,6,1},{6,7,2},{7,1,3}"
    algebra: "real algebra with basis 1,e1,...,e7; e_i^2=-1 for i=1..7; e_i e_j = -e_j e_i for i != j; products of distinct imaginary basis elements specified by the oriented lines (e_i e_j = e_k when i,j,k cyclically ordered per that line's chosen orientation, e_i e_j = -e_k for the reverse pair)"
    orientation_choice: "each of the 7 lines independently assigned one of 2 cyclic orientations -- 2^7 = 128 total algebras"

  statement: >
    Fix the seven Fano lines given by the cyclic shifts of {1,2,4} mod 7.
    For each of the 2^7=128 independent choices of line orientation, define
    the real algebra as specified above. Exactly 16 orientation choices
    yield an alternative algebra (verified via Artin's associator-alternation
    criterion). All 16 are isomorphic to the standard octonions (Baez's
    Table 1) via explicit sign changes e_i -> epsilon_i * e_i,
    epsilon_i in {+1,-1}. The remaining 112 orientations are not alternative.

  structural_explanation: >
    Encode each orientation choice as a vector s in F_2^7 (one bit per
    line). Expanding both associator-antisymmetry identities symbolically
    (swap first two arguments; swap last two arguments) for every triple
    of distinct points shows each condition is F_2-linear in s (signs
    compose by XOR of orientation bits), and both independently reduce,
    after removing the seven triples that coincide with a line itself
    (which impose no constraint), to the SAME seven point-indexed
    constraints: for each point p, the sum of orientation bits over the
    four lines NOT containing p must be even -- i.e. Cs=0 (mod 2) for
    an explicit 7x7 matrix C. Separately, a basis sign-flip transforms s
    by s -> s + M*eps (mod 2), where M is the Fano point-line incidence
    matrix. The identity C = J + M^T (mod 2, J the all-ones matrix),
    together with two design-theoretic facts about the Fano plane
    (M^T M = J and JM = J, both consequences of each point lying on
    exactly 3 lines and each pair of points sharing exactly 1 line),
    gives CM = JM + M^T M = J + J = 0 (mod 2) identically -- no
    per-triple case analysis needed for this step. This shows im(M) is
    contained in ker(C); combined with the general rank inequality
    rank(C) >= |rank(J)-rank(M)| = 3 and the dimension bound rank(C) <=
    7-rank(M) = 3 forced by containment, rank(C)=3 exactly, so
    dim ker(C) = dim im(M) = 4, forcing im(M) = ker(C) exactly. The
    exhaustive 128-orientation computer check (both antisymmetry
    identities) is independent verification of this proof, not an
    ingredient it depends on.

  leading_constraints:
    - "Norm multiplicativity is a corollary of the isomorphism to the standard octonions (which has multiplicative Euclidean norm), not an independently defining condition -- checked as verification evidence, not part of the theorem's logical structure."
    - "This statement classifies orientations of ONE FIXED labeled Fano line structure (the cyclic-shifts-of-{1,2,4} labeling). It does not separately re-derive the classical fact that the 7-point Fano plane is unique up to point relabeling; that fact is cited, not reproved here."
    - "This is a purely algebraic result; it does not establish physical_correspondence of any kind."

  excluded_generalizations:
    - "Any claim about non-Fano combinatorial structures on 7 points, or about Fano planes with a different fixed line labeling than the one specified. The rank-4 result is specific to the incidence matrix of this particular (canonical) labeling; a relabeling permutes rows/columns but does not change the rank, so this exclusion is conservative rather than a known limitation -- it has not been separately checked."
    - "Any claim that the 112 non-alternative orientations form a single algebra type, or are classified further. This statement establishes only that they fail alternativity, not what (if any) coherent structure they do have."

verification:
  proof_ref: proofs/MB_0003_FANO_ORIENTATIONS.md
  executable_ref: tests/MB_0003_fano_orientations.py

result:
  result_ref: results/MB_0003_fano_orientations.yaml
  claim_status: supported
  summary: >
    Exhaustive check of all 128 orientations: exactly 16 alternative
    (verified via associator antisymmetry over all 512 basis triples per
    orientation), all 16 also norm-multiplicative, all 16 isomorphic to
    the reference (Baez) orientation via explicit sign-flip maps found
    by search. Separately: F_2 incidence matrix M has rank 4, giving an
    image of size 16 under the sign-flip action, verified set-equal to
    the exhaustively-found alternative orientation set.

footer:
  principle: "Admissible generalizations trail leading specifications."
