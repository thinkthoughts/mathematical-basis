result:
  id: MB_0005
  test_ref: tests/MB_0005_ellipsoid_fitting_verification.py
  statement_ref: statements/MB_0005_ELLIPSOID_FITTING.yaml
  proof_ref: proofs/MB_0005_ELLIPSOID_FITTING.md

status:
  mathematical: audited
  computational: supported
  theorem_from_computation: unsupported
  claim_status: supported

computational_reading:
  distribution: "standard Gaussian coordinates"
  kappa: 3
  asymptotic_boundary:
    alpha_star: 0.25
    relation: "alpha_star(3) = 1/4"
  dimension: 40
  predicted_transition:
    relation: "n ~= alpha_star * d^2"
    n: 400

validation:
  rule: >
    A solver-reported feasible matrix is counted SAT only after direct
    validation of both the quadratic equalities and the PSD condition.
  equality_check: "max_i |x_i^T R x_i - 1| <= 1e-4"
  psd_check: "lambda_min(R) >= -1e-6"
  solver_status_alone_is_reading: false

observed_run:
  provenance: >
    Recorded from the standalone MB_0005 verification script in paper mode
    for arXiv:2608.27372. The run uses d=40 with eight trials at each sampled
    constraint density and evaluates finite-dimensional SDP readings relative
    to the Gaussian asymptotic boundary alpha_star(3)=1/4.
  runtime_refs:
    trial_log: results/mb_0005_runtime/MB_0005_trial_log.csv
    summary: results/mb_0005_runtime/MB_0005_summary.csv
    json: results/mb_0005_runtime/MB_0005_ellipsoid_fitting_verification.json
  trials_per_density: 8
  rows:
    - {alpha: 0.10,  n: 160, SAT: 8, UNSAT: 0, UNRESOLVED: 0}
    - {alpha: 0.15,  n: 240, SAT: 8, UNSAT: 0, UNRESOLVED: 0}
    - {alpha: 0.20,  n: 320, SAT: 8, UNSAT: 0, UNRESOLVED: 0}
    - {alpha: 0.225, n: 360, SAT: 8, UNSAT: 0, UNRESOLVED: 0}
    - {alpha: 0.24,  n: 384, SAT: 7, UNSAT: 1, UNRESOLVED: 0}
    - {alpha: 0.25,  n: 400, SAT: 3, UNSAT: 5, UNRESOLVED: 0}
    - {alpha: 0.26,  n: 416, SAT: 0, UNSAT: 8, UNRESOLVED: 0}
    - {alpha: 0.275, n: 440, SAT: 0, UNSAT: 8, UNRESOLVED: 0}
    - {alpha: 0.30,  n: 480, SAT: 0, UNSAT: 8, UNRESOLVED: 0}
    - {alpha: 0.35,  n: 560, SAT: 0, UNSAT: 8, UNRESOLVED: 0}
    - {alpha: 0.40,  n: 640, SAT: 0, UNSAT: 8, UNRESOLVED: 0}
  totals:
    trials: 88
    SAT: 42
    UNSAT: 46
    UNRESOLVED: 0

reading:
  below_boundary: >
    At alpha = 0.10, 0.15, 0.20, and 0.225, all 32 sampled trials
    validated SAT. At alpha = 0.24, 7 of 8 trials validated SAT and
    1 trial produced an UNSAT reading.
  at_boundary: >
    At alpha = 0.25 (n=400), the finite-dimensional sample produced
    3 SAT and 5 UNSAT readings.
  above_boundary: >
    At alpha = 0.26, 0.275, 0.30, 0.35, and 0.40, all 8 trials at
    each density produced UNSAT readings.

interpretation:
  summary: >
    The validated finite-dimensional Gaussian readings exhibit a transition
    around the asymptotic prediction alpha_star(3)=1/4. Readings are uniformly
    SAT at the sampled densities through alpha=0.225, mixed near the boundary
    at alpha=0.24 and alpha=0.25, and uniformly UNSAT at every sampled density
    from alpha=0.26 through alpha=0.40. This supports the computational
    realization of MB_0005.
  scope: >
    The run does not verify the asymptotic high-probability theorem, the CGMT
    reduction, the universality argument, the anti-concentration step, or the
    exact critical behavior at alpha = alpha_star(kappa).
  distinction: "asymptotic specification != finite computational reading"

footer:
  principle: "Admissible generalizations trail leading specifications."
